name: Gist sync

on:
  workflow_run:
    workflows: ["Subdomain scan"]
    types:
      - completed
  workflow_dispatch:

# Optional: set GIST_ID and GIST_TOKEN secrets to publish scope data to a Gist.
# If not set, scan results stay in the repo only — no failure.
# To enable: gh secret set GIST_ID --repo kdairatchi/Gov_Scope
#            gh secret set GIST_TOKEN --repo kdairatchi/Gov_Scope  (classic PAT with gist scope)

jobs:
  export-and-gist:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Push rijksoverheid scope to Gist
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if [ -z "$GIST_ID" ] || [ -z "$GIST_TOKEN" ]; then
            echo "GIST_ID/GIST_TOKEN not configured — skipping Gist export. Scope data committed to repo."
            exit 0
          fi
          python engine/gist_update.py
