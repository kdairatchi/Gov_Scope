name: Gist sync

on:
  workflow_run:
    workflows: ["Subdomain scan"]
    types:
      - completed

# Optional: set GIST_ID and GIST_TOKEN secrets to publish scope data to a Gist.
# If secrets are not set the step is skipped — scan results are always committed to the repo.
# To set up: gh secret set GIST_ID --repo kdairatchi/Gov_Scope
#            gh secret set GIST_TOKEN --repo kdairatchi/Gov_Scope  (classic PAT with gist scope)

jobs:
  export-and-gist:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: Push rijksoverheid scope to Gist
        if: ${{ secrets.GIST_ID != '' && secrets.GIST_TOKEN != '' }}
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python engine/gist_update.py

      - name: Skip Gist sync (secrets not configured)
        if: ${{ secrets.GIST_ID == '' || secrets.GIST_TOKEN == '' }}
        run: echo "GIST_ID/GIST_TOKEN not set — scope data stays in repo only. Set secrets to enable Gist export."
